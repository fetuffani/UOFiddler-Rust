name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux builds inside Debian 11 (glibc 2.31): the binary only links glibc, so building on an old
    # one makes it run on Ubuntu 20.04+, Debian 11+ and the like (X11, Wayland and OpenGL are loaded
    # at run time, no -dev packages needed).
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: rust:1-bullseye
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uofiddler-${{ runner.os }}
          path: |
            target/release/uo_gui
            target/release/uo_gui.exe
          if-no-files-found: error

  # Only pushes to master (or main) publish: the artifacts above go into a GitHub release.
  release:
    name: Release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/uo_gui/Cargo.toml | head -1).${{ github.run_number }}"
          # Linux: .tar.gz, .deb and AppImage.
          packaging/linux/package.sh artifacts/uofiddler-Linux/uo_gui "$version" dist
          # Windows: .zip.
          (cd artifacts/uofiddler-Windows && zip -q "../../dist/uofiddler-$version-windows-x86_64.zip" uo_gui.exe)
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/* --target "$GITHUB_SHA" --latest \
            --title "UOFiddler build ${{ github.run_number }}" --generate-notes
