[package]
name = "uo_gui"
version = "0.1.0"
edition = "2021"

[dependencies]
uo_core = { path = "../uo_core" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.29", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15" # File dialog for selecting UO directory
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
egui-phosphor = "0.7" # Icon font for the map editor UI (0.7.x targets egui 0.29)
ureq = { version = "2", default-features = false, features = ["tls"] } # Auto-updater: GitHub releases over HTTPS (rustls)
sha2 = "0.10" # Auto-updater: SHA-256 of the downloaded release asset
zip = { version = "2", default-features = false, features = ["deflate"] } # Auto-updater: Windows release .zip
flate2 = "1" # Auto-updater: Linux release .tar.gz
tar = "0.4"
